name: api
on:
  pull_request:
    paths: ["api/**", "packages/**", "contracts/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["api/**", "packages/**", "contracts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: assetmgr
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: assetmgr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assetmgr"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://assetmgr:ci@localhost:5432/assetmgr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run api:lint
      - run: npm run lint -w api
      - run: npm test -w api