services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: assetmgr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: assetmgr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetmgr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: