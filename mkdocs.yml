site_name: Asset Manager
site_description: Lightweight hardware asset management and deployment for SMEs
repo_url: https://github.com/harveymortimore/Final-Year-Project-ITAM-Solution
docs_dir: docs
use_directory_urls: false

theme:
  name: material

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_openapi.py
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Requirements: requirements/index.md
  - Architecture:
      - Overview: architecture/index.md
      - "ADR 0001: Stack": architecture/adr/0001-monorepo-and-stack.md
  - API Reference: api/reference.md
  - Testing: testing/index.md
  - Ethics: ethics/index.md